# Vertex AI konfiguracija za Gemini skripte
# Koriste: summarize_gemini.js, generate_article_gemini.js
#
# Env varijable (VERTEX_PROJECT, VERTEX_REGIONS) imaju prednost ako su postavljene.

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ NAPLATNI PROJEKT — JEDINI VAŽEĆI: bimbo-sync-prod                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Projekt:  bimbo-sync-prod  (projectNumber 984390019987, kreiran 14.09.2026.)
# Billing:  01FAEA-72A278-819B25  (NOVI free-trial krediti)
# Owner:    stepanic.matija@gmail.com + bimbo.sync@gmail.com (roles/owner)
# Prebačeno 14.09.2026. Verificirano istog dana: aiplatform.googleapis.com enableana,
# `gemini-3.8-flash`, `gemini-3.7-flash`, `gemini-3.5-flash` i `gemini-3-flash-preview` → HTTP 200 na globalu.
#
# ⛔ MRTVI PROJEKTI — NE VRAĆATI, NE KOPIRATI IZ STARIH DOKUMENATA:
#   1. project-a275a620-ef0c-45ae-99e (billing 016BE2-D24293-12968B)
#      Free-trial krediti POTROŠENI 31.08.2026. → od tada sve ide na karticu.
#      Zbog toga su 09.09.2026. pauzirani svi launchd jobovi
#      (docs/2026-09-09-launchd-pauza-gcp-billing.md). Koristio se 08.06.–14.09.2026.
#   2. domovina-sync-ms (billing 0140D3-08E99F-E8C697)
#      U dunningu — Vertex vraća 403 "Lightning dunning decision is deny".
#      Koristio se do 08.06.2026.
#
# Ako Vertex počne vraćati 403/429 na bimbo-sync-prod, PRVO provjeri kredite u konzoli
# (gcloud ih ne zna očitati — memory `gcp_billing_credits_not_readable`), pa tek onda
# sumnjaj na kod.
VERTEX_PROJECT=bimbo-sync-prod
# gemini-3.8-flash — prebačeno 15.09.2026. (prije: 3.5-flash od 27.06., 2.5-flash prije toga).
# Empirijski potvrđen živ na bimbo-sync-prod: global=HTTP 200. I dalje GLOBAL-ONLY
# (regionalni endpointi 404-aju za cijelu 3.x flash liniju) — zato VERTEX_REGIONS=global.
# Zašto 3.8 a ne 3.5: 3.7-flash je 25.08. kontrolirano izmjeren (docs/2026-08-25-gemini-3.7-flash-evaluacija.md)
# kao 60 % jeftiniji uz jednaku utemeljenost i sadržajniji članak; 3.8 ima isti cjenik kao 3.7
# i noviji je. ⚠️ 3.8 NIJE prošao isti kontrolirani A/B — ako kvaliteta padne, prvi osumnjičeni je ovaj switch.
GEMINI_MODEL=gemini-3.8-flash

# OAUTH IDENTITET: gcloud account koji ima aiplatform.user na VERTEX_PROJECT.
# NUŽNO pinati eksplicitno jer se globalni `gcloud config` aktivni account zna
# prebaciti na drugi SA (npr. play-publisher@ptraining-production iz Play-publishing
# alata) → `print-access-token` bez --account vrati krivi token → 403
# "aiplatform.endpoints.predict denied" na SVIM regijama. Skripte ovo prosljeđuju
# kao `gcloud auth print-access-token --account=<VERTEX_ACCOUNT>`.
VERTEX_ACCOUNT=stepanic.matija@gmail.com

# Cjenik za procjenu troška po epizodi (USD / 1M tokena) → {base}.gemini_usage.json sidecar.
# gemini-3.8-flash: $0.75 in / $3.75 out — PROMOTIVNO do 31.12.2026., od 01.01.2027. $1.50 / $7.50.
# ⚠️ Zapiši si taj datum: cijena se udvostručuje sama od sebe, bez ikakve promjene u kodu.
# Usporedba: 3.5-flash je bio $1.50 / $9.00 → ovo je pola inputa i −58 % outputa.
# Provjeri aktualno na cloud.google.com/vertex-ai/generative-ai/pricing
GEMINI_PRICE_IN=0.75
GEMINI_PRICE_OUT=3.75

# Regije za multi-region rotaciju (comma-separated).
# GLOBAL-ONLY od 2026-06-27: gemini-3.5-flash postoji SAMO na global endpointu (regionalni
# vraćaju 404), pa je 9-region rotacija no-op — svaki regionalni poziv bi 404-ao. "global"
# koristi aiplatform.googleapis.com bez region prefiksa. Posljedica: nema više N× region-throughput
# za generaciju; oslanjamo se na global RPM bazen (velik za 3.x flash). Ako se 3.5-flash ikad vrati
# na 2.5-flash (regionalni), vrati staru listu: global,us-central1,us-east1,us-east4,us-west1,us-west4,us-south1,europe-west1,europe-west4
VERTEX_REGIONS=global
