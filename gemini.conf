# Vertex AI konfiguracija za Gemini skripte
# Koriste: summarize_gemini.js, generate_article_gemini.js
#
# Env varijable (VERTEX_PROJECT, VERTEX_REGIONS) imaju prednost ako su postavljene.

VERTEX_PROJECT=domovina-sync-ms
GEMINI_MODEL=gemini-2.5-flash

# Regije za multi-region rotaciju (comma-separated).
# Svaki region ima nezavisnu kvotu — rotacijom dobivamo N× throughput.
# "global" koristi aiplatform.googleapis.com bez region prefiksa.
VERTEX_REGIONS=global,us-central1,us-east1,us-east4,us-west1,us-west4,us-south1,europe-west1,europe-west4
