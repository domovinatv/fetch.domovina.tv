# Izvorni jezik audija po kanalu — koristi KORAK 2.6 (Modal transkripcija) u run_pipeline.sh.
#
# ZAŠTO POSTOJI: Canary 1B v2 NEMA auto-detect jezika. Dobiva `--source-lang` kao tvrdnju o
# tome što je na snimci. Default je `hr`, pa engleski kanali moraju biti navedeni ovdje —
# inače model dobije krivu pretpostavku o izvoru.
#
# Ciljni jezik je UVIJEK `hr` (cijeli downstream — sažeci, članci, RAG — očekuje hrvatski;
# engleske verzije radi zasebno translate_to_english.js).
#
# ⚠️ Poznato ograničenje: en→hr prijevod je LOSSY — Canary tiho ispušta dijelove
# (EN kanali 3-9%, pojedine epizode >50%). Vidi docs/transcript_coverage_gap_2026-07.md
# i TRANSCRIPT_GAP detektor u inspect_pipeline.js. Ovdje se to NE rješava, samo se
# osigurava da barem izvorni jezik bude točno naveden.
#
# Format: <naziv_kanala>=<iso_kod>   (bash 3 kompatibilno — grep + cut, bez asocijativnih polja)
# Kanali koji nisu navedeni → hr.

launched=en
